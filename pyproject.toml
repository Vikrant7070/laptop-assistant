[project]
name = "nova"
version = "0.1.0"
description = "A local-first Windows desktop assistant: chat, voice, 3D avatar and tools."
requires-python = ">=3.12"
readme = "README.md"
# Core: what `python -m nova` needs to start (chat window, tray, tools). Windows only.
# Exact versions live in requirements*.txt (the lock); tests/test_packaging.py keeps both lists in step.
dependencies = [
    "flask", "psutil", "keyboard", "pyperclip", "pillow", "numpy",
    "pywebview", "pystray", "uiautomation", "comtypes",
]

[project.optional-dependencies]
voice = ["faster-whisper", "ctranslate2", "sounddevice", "kokoro-onnx", "soundfile"]   # hearing and her own voice
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]                                      # Whisper on the NVIDIA card
camera = ["opencv-python-headless"]                                                    # seeing you (off by default)
cloud = ["anthropic"]                       # the Claude brain; Gemini and OpenAI need no package
test = ["pytest", "ruff", "opencv-python-headless", "anthropic"]   # the suite reaches these two lazy imports
dev = ["nova[test]", "pyflakes"]
all = ["nova[voice,gpu,camera,cloud]"]

[project.scripts]
nova-doctor = "nova.doctor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nova*"]            # the app

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is hermetic: conftest.py redirects NOVA_DATA to a temp folder and stubs the
# voice, keyboard, browser, PowerShell and 3D body. Safe to run on any machine.

[tool.ruff]
target-version = "py312"
line-length = 130          # the code is deliberately dense; see docs/ARCHITECTURE.md
extend-exclude = ["data", "static", "characters", "skills", "sounds", "reports", "research_notes", ".claude"]

[tool.ruff.lint]
# Start with pyflakes-equivalent checks only. Style/lint expansion is a separate decision.
select = ["F", "E9"]
