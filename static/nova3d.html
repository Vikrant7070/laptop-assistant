<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova 3D</title>
<style>
  :root{--bg:#0d0f1a;--panel:#151829;--line:#272c48;--text:#e9ebff;--muted:#8d93b8;--accent:#7c5cff}
  body{margin:0;background:var(--bg);color:var(--text);font:14px "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
  #stage{background:radial-gradient(circle at 50% 60%,#232a52,#0d0f1a 70%);border:1px solid var(--line);border-radius:16px}
  .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px}
  button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
  button.on,button:hover{border-color:var(--accent)}
  #msg{color:var(--muted)}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"}}</script>
</head>
<body>
<canvas id="stage" width="520" height="680"></canvas>
<div class="row" id="anims"></div>
<div class="row"><button id="spin">Spin 360°</button></div>
<div id="msg">Drag left/right on Nova to turn her around.</div>
<script type="module">
import * as THREE from "three";

/* ------------------------------------------------------------------ materials */
const grad = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({color, gradientMap: grad, ...extra});
const M = {
  skin: toon(0xffe2d4), hair: toon(0x6b4fe0, {side: THREE.DoubleSide}), hairDark: toon(0x4a33b0, {side: THREE.DoubleSide}),
  tip: toon(0x45d4ef), hood: toon(0x2c3266), hoodDark: toon(0x1e2247), leg: toon(0x252a4d), shoe: toon(0xf1f2ff),
  phone: toon(0x20243f), glow: new THREE.MeshBasicMaterial({color: 0x5fe3f5}), star: toon(0xffd25e, {emissive: 0x553300}),
  hat: toon(0xff6b9d), inner: toon(0xffb3c7), wood: toon(0xb07a52), woodDark: toon(0x7d5236), metal: toon(0xd3d7ef), lens: new THREE.MeshBasicMaterial({color: 0xbfefff, transparent: true, opacity: .25}),
};
// Colours drawn into the eye pictures (changed by applyLook).
const EYE = {main: "#7c5cff", dark: "#2a1572", light: "#6ee7f9", skin: "#ffe2d4"};
const outlineMat = new THREE.MeshBasicMaterial({color: 0x1a1033, side: THREE.BackSide});

function mesh(geo, mat, outline = 0.035) {
  const m = new THREE.Mesh(geo, mat);
  if (outline) { const o = new THREE.Mesh(geo, outlineMat); o.scale.setScalar(1 + outline); m.add(o); }
  return m;
}

/* ------------------------------------------------------------------ face textures (anime eyes drawn in 2D) */
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function eyeTex(kind, lx = 0, ly = 0) {
  return canvasTex(128, 160, g => {
    g.lineCap = "round"; g.strokeStyle = "#241548";
    if (kind === "closed") { g.lineWidth = 9; g.beginPath(); g.moveTo(14, 96); g.quadraticCurveTo(64, 116, 114, 96); g.stroke(); return; }
    if (kind === "happy") { g.lineWidth = 11; g.beginPath(); g.moveTo(16, 108); g.quadraticCurveTo(64, 40, 112, 108); g.stroke(); return; }
    if (kind === "wide") {   // surprised: big white eye, small iris, brow lifted high
      g.beginPath(); g.ellipse(64, 90, 52, 62, 0, 0, Math.PI * 2); g.fillStyle = "#fff"; g.fill(); g.lineWidth = 7; g.stroke();
      g.fillStyle = EYE.main; g.beginPath(); g.ellipse(64, 92, 24, 30, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#160b38"; g.beginPath(); g.ellipse(64, 94, 10, 13, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#fff"; g.beginPath(); g.arc(74, 80, 7, 0, 7); g.fill();
      g.lineWidth = 9; g.beginPath(); g.moveTo(22, 14); g.quadraticCurveTo(64, -6, 106, 14); g.stroke(); return;
    }
    g.save(); g.beginPath(); g.ellipse(64, 88, 50, 64, 0, 0, Math.PI * 2); g.fillStyle = "#fff"; g.fill(); g.clip();
    const gr = g.createLinearGradient(0, 30 + ly, 0, 150 + ly);
    gr.addColorStop(0, EYE.dark); gr.addColorStop(.5, EYE.main); gr.addColorStop(1, EYE.light);
    g.fillStyle = gr; g.beginPath(); g.ellipse(64 + lx, 96 + ly, 40, 54, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#160b38"; g.beginPath(); g.ellipse(64 + lx, 100 + ly, 17, 24, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(82 + lx, 72 + ly, 13, 0, 7); g.fill();
    g.globalAlpha = .85; g.beginPath(); g.arc(48 + lx, 116 + ly, 6, 0, 7); g.fill(); g.globalAlpha = 1;
    if (kind === "half") { g.fillStyle = EYE.skin; g.fillRect(0, 0, 128, 92); }
    if (kind === "sadL" || kind === "sadR" || kind === "angryL" || kind === "angryR") {
      // sad: the upper lid slopes down towards the outside of the face; angry (a pout): down towards the nose
      const hi = 62, lo = 100, a = kind === "sadL" || kind === "angryR" ? [lo, hi] : [hi, lo];
      g.fillStyle = EYE.skin; g.beginPath(); g.moveTo(0, 0); g.lineTo(128, 0); g.lineTo(128, a[1]); g.lineTo(0, a[0]); g.closePath(); g.fill();
    }
    g.restore();
    g.lineWidth = 11; g.beginPath();
    if (kind === "half") { g.moveTo(12, 92); g.lineTo(116, 92); }
    else if (kind === "sadL") { g.moveTo(10, 100); g.lineTo(118, 62); }
    else if (kind === "sadR" || kind === "angryL") { g.moveTo(10, 62); g.lineTo(118, 100); }
    else if (kind === "angryR") { g.moveTo(10, 100); g.lineTo(118, 62); }
    else { g.moveTo(10, 62); g.quadraticCurveTo(64, 4, 118, 60); g.moveTo(112, 54); g.lineTo(124, 44); }
    g.stroke();
  });
}
const mouthTex = kind => canvasTex(64, 48, g => {
  g.lineCap = "round";
  if (kind === "smile") { g.strokeStyle = "#b4475f"; g.lineWidth = 5; g.beginPath(); g.moveTo(16, 18); g.quadraticCurveTo(32, 32, 48, 18); g.stroke(); }
  else if (kind === "frown") { g.strokeStyle = "#b4475f"; g.lineWidth = 5; g.beginPath(); g.moveTo(16, 30); g.quadraticCurveTo(32, 14, 48, 30); g.stroke(); }
  else if (kind === "o") { g.fillStyle = "#8f2f48"; g.beginPath(); g.ellipse(32, 24, 8, 10, 0, 0, 7); g.fill(); }
  else if (kind === "open") { g.fillStyle = "#8f2f48"; g.beginPath(); g.ellipse(32, 24, 12, 13, 0, 0, 7); g.fill(); g.fillStyle = "#ff8fa6"; g.beginPath(); g.ellipse(32, 31, 8, 5, 0, 0, 7); g.fill(); }
  else { g.fillStyle = "#8f2f48"; g.beginPath(); g.moveTo(12, 14); g.quadraticCurveTo(32, 46, 52, 14); g.closePath(); g.fill(); g.fillStyle = "#ff8fa6"; g.beginPath(); g.ellipse(32, 30, 9, 5, 0, 0, 7); g.fill(); }
});
const makeEyes = () => ({open: eyeTex("open"), closed: eyeTex("closed"), happy: eyeTex("happy"), half: eyeTex("half"), up: eyeTex("open", 9, -14),
        wide: eyeTex("wide"), sadL: eyeTex("sadL"), sadR: eyeTex("sadR"), angryL: eyeTex("angryL"), angryR: eyeTex("angryR"), side: eyeTex("open", 14, 0), sideB: eyeTex("open", -14, 0),
        down: eyeTex("open", 0, 13)});
const TEX = {
  eye: makeEyes(),
  mouth: {smile: mouthTex("smile"), open: mouthTex("open"), grin: mouthTex("grin"), frown: mouthTex("frown"), o: mouthTex("o")},
};
// Little symbols that pop up beside her head: ? ! ♪ ♥ z and a sweat drop.
const symTex = (ch, color) => canvasTex(96, 96, g => {
  if (ch === "drop") {
    g.fillStyle = "#7fd8ff"; g.strokeStyle = "#1a1033"; g.lineWidth = 5; g.beginPath();
    g.moveTo(48, 10); g.bezierCurveTo(82, 52, 76, 86, 48, 86); g.bezierCurveTo(20, 86, 14, 52, 48, 10); g.fill(); g.stroke(); return;
  }
  g.font = "bold 80px 'Segoe UI', sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.lineWidth = 10; g.lineJoin = "round"; g.strokeStyle = "#1a1033"; g.strokeText(ch, 48, 52); g.fillStyle = color; g.fillText(ch, 48, 52);
});
// "</>" floating up while she works at her laptop (a smaller font: three characters)
const codeTex = canvasTex(96, 96, g => {
  g.font = "bold 40px Consolas, 'Segoe UI', monospace"; g.textAlign = "center"; g.textBaseline = "middle";
  g.lineWidth = 8; g.lineJoin = "round"; g.strokeStyle = "#1a1033"; g.strokeText("</>", 48, 50); g.fillStyle = "#6ee7f9"; g.fillText("</>", 48, 50);
});
const SYM = {code: codeTex, q: symTex("?", "#ffd25e"), bang: symTex("!", "#ff6b81"), note: symTex("♪", "#6ee7f9"), heart: symTex("♥", "#ff6b9d"),
             z: symTex("z", "#c9c2ff"), drop: symTex("drop")};
const blushTex = canvasTex(64, 32, g => { const r = g.createRadialGradient(32, 16, 2, 32, 16, 30); r.addColorStop(0, "rgba(255,120,160,.75)"); r.addColorStop(1, "rgba(255,120,160,0)"); g.fillStyle = r; g.fillRect(0, 0, 64, 32); });
const decal = (tex, w, h) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({map: tex, transparent: true, depthWrite: false}));

function starShape(R, r) {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r : R; s[i ? "lineTo" : "moveTo"](Math.cos(a) * d, Math.sin(a) * d); }
  return s;
}

/* ------------------------------------------------------------------ build Nova */
const nova = new THREE.Group();
nova.visible = false;      // drawn only once her character's VRM model has loaded (there is no other body to show)
const body = new THREE.Group(); nova.add(body);

// legs
const legs = [-1, 1].map(s => {
  const hip = new THREE.Group(); hip.position.set(.2 * s, .86, 0); body.add(hip);
  const leg = mesh(new THREE.CapsuleGeometry(.12, .44, 6, 16), M.leg); leg.position.y = -.33; hip.add(leg);
  const shoe = mesh(new THREE.SphereGeometry(.16, 20, 14), M.shoe, .06); shoe.scale.set(1, .7, 1.45); shoe.position.set(0, -.72, .07); hip.add(shoe);
  return hip;
});
// torso
const torso = mesh(new THREE.CapsuleGeometry(.42, .45, 8, 24), M.hood); torso.scale.set(1.05, 1, .82); torso.position.y = 1.28; body.add(torso);
const hem = mesh(new THREE.CylinderGeometry(.46, .56, .32, 28), M.hoodDark); hem.position.y = .95; body.add(hem);
const collar = new THREE.Mesh(new THREE.TorusGeometry(.27, .045, 10, 32), M.glow); collar.rotation.x = Math.PI / 2; collar.position.y = 1.64; body.add(collar);
const chestStar = new THREE.Mesh(new THREE.ExtrudeGeometry(starShape(.15, .065), {depth: .04, bevelEnabled: false}), M.star);
chestStar.position.set(0, 1.28, .36); body.add(chestStar);
const neck = mesh(new THREE.CylinderGeometry(.11, .12, .24, 16), M.skin, 0); neck.position.y = 1.72; body.add(neck);
// arms
const arms = [-1, 1].map(s => {
  const sh = new THREE.Group(); sh.position.set(.52 * s, 1.52, 0); body.add(sh);
  const up = mesh(new THREE.CapsuleGeometry(.12, .5, 6, 16), M.hood); up.position.y = -.36; sh.add(up);
  const hand = mesh(new THREE.SphereGeometry(.14, 18, 14), M.skin, .06); hand.position.y = -.74; sh.add(hand);
  sh.userData.hand = hand; return sh;
}); // arms[0] = her right arm (viewer's left)

// head
const neckTop = new THREE.Group(); neckTop.position.y = 1.8; body.add(neckTop);
const head = new THREE.Group(); head.position.y = .9; neckTop.add(head);
const skull = mesh(new THREE.SphereGeometry(.95, 48, 32), M.skin, .025); skull.scale.set(1, .95, .92); head.add(skull);
const eyes = [-1, 1].map(s => { const e = decal(TEX.eye.open, .42, .52); e.position.set(.36 * s, -.1, .86); e.rotation.set(.1, .38 * s, 0); head.add(e); return e; });
const mouth = decal(TEX.mouth.smile, .24, .18); mouth.position.set(0, -.5, .8); mouth.rotation.x = .5; head.add(mouth);
const blushes = [-1, 1].map(s => { const b = decal(blushTex, .34, .17); b.position.set(.55 * s, -.36, .7); b.rotation.set(.35, .7 * s, 0); head.add(b); return b; });
// hair
const cap = mesh(new THREE.SphereGeometry(1, 48, 24, 0, Math.PI * 2, 0, Math.PI * .4), M.hair, .03); cap.scale.set(1.05, 1.02, .99); cap.position.y = .04; head.add(cap);
const back = mesh(new THREE.SphereGeometry(1, 48, 24, Math.PI - .55, Math.PI + 1.1, 0, Math.PI * .82), M.hair, .03); back.scale.set(1.05, 1.01, 1.02); head.add(back);
[-0.95, -0.5, 0, 0.5, 0.95].forEach((a, i) => {
  const g = new THREE.Group(); g.rotation.y = a; head.add(g);
  const len = [.62, .55, .42, .55, .62][i];
  const c = mesh(new THREE.ConeGeometry(.23, len, 10), M.hair, .04); c.scale.z = .5;
  c.position.set(0, .3 - len / 2 + .1, .9); c.rotation.x = -Math.PI + .3; g.add(c);
});
const locks = [-1, 1].map(s => {
  const g = new THREE.Group(); g.position.set(.9 * s, -.2, .05); head.add(g);
  const l = mesh(new THREE.CapsuleGeometry(.17, 1.25, 6, 14), M.hair); l.position.y = -.7; l.rotation.z = .06 * s; g.add(l);
  const t = mesh(new THREE.ConeGeometry(.17, .35, 12), M.tip, .05); t.rotation.x = Math.PI; t.position.y = -1.55; g.add(t);
  return g;
});
const longHair = new THREE.Group(); longHair.position.set(0, -.3, -.45); head.add(longHair);
const lh = mesh(new THREE.CapsuleGeometry(.72, 1.05, 8, 24), M.hairDark); lh.scale.set(1.18, 1, .45); lh.position.y = -.8; longHair.add(lh);
const lhTip = mesh(new THREE.SphereGeometry(.72, 24, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), M.tip, .03); lhTip.scale.set(1.18, .6, .45); lhTip.position.y = -1.32; longHair.add(lhTip);
const ahoge = mesh(new THREE.TorusGeometry(.3, .045, 8, 24, Math.PI * .7), M.hair, .1); ahoge.position.set(-.25, .92, .05); ahoge.rotation.z = .4; head.add(ahoge);
// headphones + hair clip
const band = mesh(new THREE.TorusGeometry(1.07, .07, 12, 48, Math.PI), M.phone, .05); band.position.y = -.05; band.rotation.x = -.15; head.add(band);
const phones = [band];
[-1, 1].forEach(s => {
  const cup = mesh(new THREE.CylinderGeometry(.27, .27, .2, 28), M.phone, .05); cup.rotation.z = Math.PI / 2; cup.position.set(1.02 * s, -.12, 0); head.add(cup);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.19, .035, 8, 28), M.glow); ring.rotation.y = Math.PI / 2; ring.position.set(1.13 * s, -.12, 0); head.add(ring);
  phones.push(cup, ring);
});
// Listening sign: three glowing arcs at each headphone cup, rippling outwards (shown by layers() while she listens)
const earWaves = [-1, 1].map(s => {
  const g = new THREE.Group(); g.position.set(1.13 * s, -.12, .05); g.visible = false; head.add(g);
  g.userData.rings = [0, 1, 2].map(() => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(.36, .06, 6, 24, 1.4),
                             new THREE.MeshBasicMaterial({color: 0x6ee7f9, transparent: true, depthWrite: false}));
    m.rotation.z = s > 0 ? -.65 : Math.PI - .65; m.renderOrder = 6; g.add(m); return m;
  });
  return g;
});
const clip = new THREE.Mesh(new THREE.ExtrudeGeometry(starShape(.15, .065), {depth: .05, bevelEnabled: false}), M.star);
clip.position.set(.5, .55, .74); clip.rotation.set(-.3, .45, .2); head.add(clip);
// extra things she can wear (change_look): glasses, cat ears, a beanie, a hair bow
const glasses = new THREE.Group(); head.add(glasses); glasses.visible = false;
[-1, 1].forEach(s => {
  const g = new THREE.Group(); g.position.set(.36 * s, -.1, .93); g.rotation.set(.1, .38 * s, 0); glasses.add(g);
  g.add(new THREE.Mesh(new THREE.TorusGeometry(.25, .035, 8, 32), M.phone));
  g.add(new THREE.Mesh(new THREE.CircleGeometry(.25, 32), M.lens));
});
const bridge = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .2, 8), M.phone); bridge.rotation.z = Math.PI / 2; bridge.position.set(0, -.02, 1.0); glasses.add(bridge);
const catEars = new THREE.Group(); head.add(catEars); catEars.visible = false;
[-1, 1].forEach(s => {
  const e = mesh(new THREE.ConeGeometry(.28, .55, 4), M.hair, .05); e.position.set(.55 * s, .82, -.05); e.rotation.set(0, Math.PI / 4, -.42 * s); catEars.add(e);
  const i = new THREE.Mesh(new THREE.ConeGeometry(.15, .34, 4), M.inner); i.position.set(.55 * s + .03 * s, .8, .07); i.rotation.set(0, Math.PI / 4, -.42 * s); catEars.add(i);
});
const beanie = new THREE.Group(); head.add(beanie); beanie.visible = false;
const bHat = mesh(new THREE.SphereGeometry(1.08, 40, 20, 0, Math.PI * 2, 0, Math.PI * .45), M.hat, .03); bHat.position.y = .02; beanie.add(bHat);
const bRim = mesh(new THREE.TorusGeometry(.98, .1, 10, 40), M.hat, .03); bRim.rotation.x = Math.PI / 2 - .1; bRim.position.y = .2; beanie.add(bRim);
const bPom = mesh(new THREE.SphereGeometry(.2, 16, 12), M.shoe, .05); bPom.position.y = 1.12; beanie.add(bPom);
const bow = new THREE.Group(); bow.position.set(-.55, .62, .55); bow.rotation.set(-.3, -.5, -.3); head.add(bow); bow.visible = false;
[-1, 1].forEach(s => { const w = mesh(new THREE.ConeGeometry(.2, .36, 12), M.hat, .06); w.rotation.z = Math.PI / 2 * s; w.position.x = .18 * s; w.scale.z = .5; bow.add(w); });
bow.add(mesh(new THREE.SphereGeometry(.09, 12, 10), M.hat, .06));
// her desk and laptop: shown only by the "work" animation (she's busy on a task, not listening)
const desk = new THREE.Group(); desk.visible = false; nova.add(desk);
const deskTop = mesh(new THREE.BoxGeometry(2.5, .09, 1.0), M.wood, .02); deskTop.position.set(0, .955, .7); desk.add(deskTop);
const deskFront = mesh(new THREE.BoxGeometry(2.36, .9, .06), M.woodDark, .02); deskFront.position.set(0, .46, 1.14); desk.add(deskFront);
[-1, 1].forEach(s => { const l = mesh(new THREE.BoxGeometry(.09, .92, .92), M.woodDark, .02); l.position.set(1.16 * s, .46, .7); desk.add(l); });
const lapBase = mesh(new THREE.BoxGeometry(.95, .05, .6), M.metal, .03); lapBase.position.set(0, 1.025, .72); desk.add(lapBase);
const lid = new THREE.Group(); lid.position.set(0, 1.05, 1.0); lid.rotation.x = .2; desk.add(lid);   // hinge; screen faces her
const lidBox = mesh(new THREE.BoxGeometry(.95, .62, .035), M.metal, .03); lidBox.position.y = .31; lid.add(lidBox);
const screen = new THREE.Mesh(new THREE.PlaneGeometry(.86, .54), M.glow); screen.rotation.y = Math.PI; screen.position.set(0, .31, -.02); lid.add(screen);
const logo = new THREE.Mesh(new THREE.ExtrudeGeometry(starShape(.1, .045), {depth: .02, bevelEnabled: false}),
                            new THREE.MeshBasicMaterial({color: 0x5fe3f5, transparent: true}));
logo.position.set(0, .33, .02); lid.add(logo);
const mug = mesh(new THREE.CylinderGeometry(.11, .1, .22, 18), M.hat, .05); mug.position.set(.86, 1.11, .62); desk.add(mug);
const mugHandle = mesh(new THREE.TorusGeometry(.065, .022, 8, 16), M.hat, .1); mugHandle.position.set(.98, 1.11, .62); desk.add(mugHandle);

// two symbol slots floating near her head (hidden unless an animation shows them)
const fx = [0, 1].map(() => { const d = decal(SYM.q, 1.3, 1.3); d.visible = false; d.renderOrder = 5; return d; });
function sym(i, tex, x, y, size = 1, alpha = 1, tilt = 0) {
  const d = fx[i]; d.visible = true; d.material.map = tex; d.material.opacity = alpha;
  d.position.set(x, y + (vrm ? VRM_TOP - 3.55 : 0), 1.6); d.scale.setScalar(size); d.rotation.z = tilt;   // above the taller VRM's head too
}

/* ------------------------------------------------------------------ scene */
const W = 260, H = 340;
const canvas = document.getElementById("stage");
// ?live=1: the hidden renderer for desktop Nova (desktop.py). Straight (not premultiplied) alpha, read back each frame.
const LIVE = new URLSearchParams(location.search).has("live");
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: !LIVE});
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene(); scene.add(nova); fx.forEach(d => scene.add(d));
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a7cff, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(3, 6, 8); scene.add(sun);
const rim = new THREE.DirectionalLight(0x6ee7f9, 1.2); rim.position.set(-6, 3, -4); scene.add(rim);
const camera = new THREE.PerspectiveCamera(28, W / H, .1, 100);
camera.position.set(0, 2.5, 11); camera.lookAt(0, 2.5, 0);

/* ------------------------------------------------------------------ animations: pose(name, t in [0,1)) */
// Lying down asleep, k = how far down (1 = lying, 0 = standing; the wake-up move gets her up through it).
// She lies on her side, head to the left on her arm, knees drawn up, turned a little towards you.
const NAP = {rz: 1.5, ry: -.3, x: 1.95, y: 1.35};
function napPose(k, breathe = 0) {

    g.fillStyle = "#fff"; g.fillText(names[n], x0 + 6, y0 + 15);
    for (let p = 0; p < phases.length; p++) {
      pose(names[n], phases[p]); draw(1 / 12);
      const img = new Image(); img.src = canvas.toDataURL("image/png"); await img.decode();
      g.drawImage(img, x0 + p * W / 2, y0 + 20, W / 2, H / 2);
    }
  }
  sheet.style.cssText = "position:fixed;left:0;top:0;z-index:9;max-width:100vw"; document.body.appendChild(sheet);
  renderer.setPixelRatio(2); renderer.setSize(W, H, false); still = false;
  return [sheet.width, sheet.height];
};
